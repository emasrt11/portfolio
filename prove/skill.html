<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le mie skill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-canvas:#f5f5f5;--bg-panel:#fff;--text-primary:#1e1e1e;--text-secondary:#6b6b6b;--border-default:#e3e3e3;
--sticky-blue:#a8daff;--sticky-purple:#cdb4ff;--sticky-yellow:#ffe066;--sticky-green:#a8f0c6;
--font-heading:"Fraunces",ui-serif,Georgia,serif;--font-sans:"Inter",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--bg-canvas);font:14px/1.4 var(--font-sans);color:var(--text-primary)}
h1{font-size:18px;margin:0 0 4px}p.sub{margin:0 0 24px;color:var(--text-secondary)}
.tile{width:464px;border-radius:12px;padding:24px 24px 28px;overflow:hidden;color:var(--text-primary);background:var(--sticky-yellow)}
.tile h3{margin:0 0 4px;font:600 22px/1.25 var(--font-heading)}.tile p{margin:0;font-size:14px;line-height:1.5}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:10px 8px;margin-top:20px}
.chip{display:inline-block;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.06);
 font:500 14px/1 var(--font-sans);white-space:nowrap;will-change:transform;cursor:default}
</style></head><body>
<h1>Le mie skill</h1><p class="sub">Hard e soft skill mescolate. Le chip ondeggiano leggermente sul posto; avvicinando il mouse si spostano e poi tornano al loro posto.</p>
<div class="tile" id="T"><h3>Le mie skill</h3><p>Il mestiere e il modo di lavorare, tutto insieme.</p><div class="chips"></div></div>
<script>
// hard e soft skill mescolate (ordine fisso)
const SKILLS=['Curiosità','Design system','Prototipazione','Empatia','Comunicazione efficace','HTML/CSS','Visual design','Creatività','Pensiero critico','Web design','Branding','Flessibilità','Wireframing','Problem solving','Interface design','Lavoro di squadra','Illustrazione','Innovazione','Adattabilità','Motion design'];
const fixed=new URLSearchParams(location.search);const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const R=110,PUSH=46;
function setup(tile,list){
 const box=tile.querySelector('.chips');
 const chips=list.map((s,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=s;box.appendChild(c);
  return{el:c,ph:i*1.7,fx:.5+((i*37)%10)/25,fy:.45+((i*53)%10)/28,x:0,y:0,vx:0,vy:0}});
 const m={x:-999,y:-999};
 tile.addEventListener('pointermove',e=>{const r=box.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top});
 tile.addEventListener('pointerleave',()=>{m.x=m.y=-999});
 function step(t,dt){
  chips.forEach(c=>{
   const w=c.el.offsetWidth,h=c.el.offsetHeight,cx=c.el.offsetLeft+w/2,cy=c.el.offsetTop+h/2;
   let tx=reduce?0:Math.sin(t*c.fx+c.ph)*3,ty=reduce?0:Math.cos(t*c.fy+c.ph*1.3)*3;
   const dx=cx+c.x-m.x,dy=cy+c.y-m.y,d=Math.hypot(dx,dy);
   if(d<R&&d>0.01){const f=Math.pow(1-d/R,1.5)*PUSH;tx+=dx/d*f;ty+=dy/d*f}
   const k=60,b=11;c.vx+=((tx-c.x)*k-c.vx*b)*dt;c.vy+=((ty-c.y)*k-c.vy*b)*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
   c.el.style.transform=`translate(${c.x.toFixed(2)}px,${c.y.toFixed(2)}px)`;});
 }
 return{step,m};
}
const o=setup(document.getElementById('T'),SKILLS);
if(fixed.has('t')){const t=+fixed.get('t');const mx=fixed.get('mx'),my=fixed.get('my');
 if(mx!==null){o.m.x=+mx;o.m.y=+my}
 for(let s=0;s<120;s++)o.step(t,1/60);}
else{let last=performance.now(),t=0;(function loop(n){const dt=Math.min(.05,Math.max(0,(n-last)/1000));last=n;t+=dt;o.step(t,dt);requestAnimationFrame(loop)})(last)}
</script></body></html>
