<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le mie skill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-panel:#fff;--bg-raised:#ededed;--text-primary:#1e1e1e;--text-secondary:#6b6b6b;--border-default:#e3e3e3;--radius-md:8px;--radius-full:999px;
--font-heading:"Fraunces",Georgia,serif;--font-sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f5f5;font:14px/1.4 var(--font-sans);color:var(--text-primary)}
.note{max-width:900px;margin:0 auto 24px;color:var(--text-secondary)}
.panel{max-width:1296px;margin:0 auto;background:var(--bg-panel);border-radius:var(--radius-md);padding:48px 48px 56px;box-shadow:0 4px 8px rgba(30,30,30,.06),0 16px 48px rgba(30,30,30,.2)}
.sec{display:flex;flex-direction:column;gap:16px}
.t-label{font:500 14px/1.4 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.skills{display:grid;grid-template-columns:340px 1fr;gap:32px;align-items:start}
.skills h3{font:600 22px/1.25 var(--font-heading);margin:0 0 12px}.skills p{font:400 16px/1.5 var(--font-sans);margin:0}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:10px 8px}
.chips span{display:inline-block;padding:6px 16px;border-radius:var(--radius-full);background:var(--bg-raised);font:500 16px/1.5 var(--font-sans);white-space:nowrap;will-change:transform;cursor:default}
@media (max-width:900px){.skills{grid-template-columns:1fr}.panel{padding:24px}}
</style></head><body>
<p class="note">Sezione «Le mie skill» senza fondo colorato, chip tutte uguali. Le chip ondeggiano sul posto e si scansano quando il mouse si avvicina. Sopra e sotto c’è lo spazio della pagina Chi sono (1200 px di contenuto).</p>
<div class="panel"><div class="sec"><span class="t-label">Le mie skill</span>
 <div class="skills"><div><h3>Le mie skill</h3><p>Il mestiere e il modo di lavorare, tutto insieme.</p></div><div class="chips" id="chips"></div></div></div></div>
<script>
const SK=['Curiosità','Design system','Prototipazione','Empatia','Comunicazione efficace','HTML/CSS','Visual design','Creatività','Pensiero critico','Web design','Branding','Flessibilità','Wireframing','Problem solving','Interface design','Lavoro di squadra','Illustrazione','Innovazione','Adattabilità','Motion design'];
const q=new URLSearchParams(location.search),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const box=document.getElementById('chips'),area=box.closest('.skills');
const chips=SK.map((s,i)=>{const c=document.createElement('span');c.textContent=s;box.appendChild(c);return{el:c,ph:i*1.7,fx:.5+((i*37)%10)/25,fy:.45+((i*53)%10)/28,x:0,y:0,vx:0,vy:0}});
const m={x:-999,y:-999};
document.querySelector('.panel').addEventListener('pointermove',e=>{const r=box.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top});
document.querySelector('.panel').addEventListener('pointerleave',()=>{m.x=m.y=-999});
if(q.has('mx')){m.x=+q.get('mx');m.y=+q.get('my')}
function step(t,dt){chips.forEach(c=>{const cx=c.el.offsetLeft+c.el.offsetWidth/2,cy=c.el.offsetTop+c.el.offsetHeight/2;
 let tx=reduce?0:Math.sin(t*c.fx+c.ph)*3,ty=reduce?0:Math.cos(t*c.fy+c.ph*1.3)*3;
 const dx=cx+c.x-m.x,dy=cy+c.y-m.y,d=Math.hypot(dx,dy);if(!reduce&&d<110&&d>.01){const f=Math.pow(1-d/110,1.5)*46;tx+=dx/d*f;ty+=dy/d*f}
 c.vx+=((tx-c.x)*60-c.vx*11)*dt;c.vy+=((ty-c.y)*60-c.vy*11)*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.el.style.transform=`translate(${c.x.toFixed(2)}px,${c.y.toFixed(2)}px)`})}
if(q.has('t')||reduce){const t=+(q.get('t')||2);for(let s=0;s<120;s++)step(t,1/60)}
else{let last=performance.now(),t=0;(function L(n){const dt=Math.min(.05,Math.max(0,(n-last)/1000));last=n;t+=dt;step(t,dt);requestAnimationFrame(L)})(last)}
</script></body></html>
